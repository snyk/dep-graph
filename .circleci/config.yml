version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1

defaults: &defaults
  resource_class: small
  docker:
    - image: cimg/node:22.22

go_image: &go_image
  resource_class: small
  docker:
    - image: cimg/go:1.24.9

go_node_image: &go_node_image
  resource_class: small
  docker:
    - image: cimg/go:1.25-node

performance_image: &performance_image
  resource_class: medium
  docker:
    - image: cimg/node:20.20.2@sha256:0d73af8b6c5a1bb95f66f78e919a2e174dcfccbfd602536ba33dea0a74116a02

jobs:
  security-scans:
    <<: *go_node_image
    steps:
      - checkout
      - run:
          name: Install
          command: npm install
      - prodsec/security_scans:
          mode: auto
          iac-scan: disabled
          release-branch: master

  test_ts:
    <<: *defaults
    working_directory: ~/work
    steps:
      - checkout
      - run:
          name: Install
          command: npm install
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Test
          command: npm test

  test_go:
    <<: *go_image
    working_directory: ~/work
    steps:
      - checkout
      - run:
          name: Test
          working_directory: go
          command: mkdir -p ../testresults && gotestsum --junitfile ../testresults/test-results.xml ./...
      - store_test_results:
          path: testresults/

  performance_create_from_json:
    <<: *performance_image
    working_directory: ~/work
    steps:
      - checkout
      - run:
          name: Install
          command: npm install
      - run:
          name: Blocking createFromJSON performance regression gate
          no_output_timeout: 30m
          command: |
            mkdir -p benchmark/results/create-from-json-ci
            benchmark_base=()
            if [ "${CIRCLE_BRANCH}" = "master" ]; then
              benchmark_base=(--base HEAD^)
            fi
            set +e
            npm run benchmark:create-from-json:ci -- --output benchmark/results/create-from-json-ci "${benchmark_base[@]}" 2>&1 | tee benchmark/results/create-from-json-ci/ci.log
            benchmark_status=${PIPESTATUS[0]}
            set -e
            echo "${benchmark_status}" > benchmark/results/create-from-json-ci/exit-code
      - store_artifacts:
          path: benchmark/results/create-from-json-ci
          destination: create-from-json-performance
      - run:
          name: Enforce createFromJSON performance decision
          command: exit "$(cat benchmark/results/create-from-json-ci/exit-code)"

  release:
    <<: *defaults
    working_directory: ~/work
    steps:
      - checkout
      - run:
          name: Install
          command: npm install
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release@25

workflows:
  version: 2
  test:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-vuln-alerts-arch

      - security-scans:
          name: Security Scans
          context:
            - team-analysis-arch
            - prodsec-orb-runtime

      - test_ts:
          name: Test TS code

      - test_go:
          name: Test Go code

      - performance_create_from_json:
          name: createFromJSON performance regression

      - release:
          name: Release
          requires:
            - Test TS code
            - Test Go code
            - createFromJSON performance regression
          context:
            - nodejs-install
            - github-release
          filters:
            branches:
              only:
                - master
